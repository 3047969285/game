<!doctype html>
<meta charset="utf-8" />
<title>角色预览（开发工具）</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="module">
import * as THREE from "three";
import { createExplorerAvatar } from "/src/features/world/explorerAvatar.ts";
import { createPerson } from "/src/features/world/people.ts";
import { spawnActor } from "/src/features/memory/actors.ts";

import { loadHumanModels } from "/src/features/world/humanVisual.ts";
await loadHumanModels();
const q = new URLSearchParams(location.search);
const view = q.get("v") || "full";
const mode = q.get("mode") || "explorer";
const pose = q.get("pose") || "stand";
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c2d6);
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x4a4a3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(2.5, 4, 3);
sun.castShadow = true;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.015;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xddeaff, 1.3);
fill.position.set(-2, 2, 4);
scene.add(fill);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x6d8a55, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const buildStart = performance.now();
let actorHandle;
let avatar;
if (mode === "actor") {
  actorHandle = spawnActor({
    id: "preview-student",
    name: "Student",
    look: {
      shirt: 0x54798d,
      trousers: 0x34445b,
      skin: 0xe0b89c,
      hair: 0x30241e,
      hairStyle: q.get("human") === "female" ? "long" : "short",
      outfit: q.get("outfit") || "coat",
      garmentDetail: q.get("detail") || "low",
    },
    position: { x: 0, y: 0, z: 0 },
    rotationY: +(q.get("yaw") ?? 0.25),
    pose,
  }, [], q.get("detail") === "high" ? "high" : "low");
  avatar = actorHandle.root;
  if (pose === "walk") actorHandle.walkTo({ x: 0.1, y: 0, z: 0.08 }, 3);
  const expression = q.get("expression");
  if (expression) avatar.children[0].userData.personRig.setExpression(expression);
} else {
  avatar = createExplorerAvatar();
  avatar.rotation.y = +(q.get("yaw") ?? 0.5);
}
const buildMs = Math.round(performance.now() - buildStart);
avatar.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

if (mode !== "actor" && q.get("npcs")) {
  avatar.visible = false;
  const colors = [0xc79a3a, 0x6a8aa8, 0xb04a40, 0x79aaa5, 0x8a6a9a, 0xc18168, 0x496c72, 0xd9c8a8];
  colors.forEach((color, i) => {
    const npc = createPerson({ shirt: color, hair: i % 3 === 0 ? 0x555555 : 0x2b1d16, hairStyle: i % 2 ? "long" : "short", glasses: i % 4 === 1, scale: 1 });
    npc.position.set((i - 3.5) * 0.7, 0, 0);
    npc.rotation.y = 0.2;
    npc.traverse((object) => { if (object.isMesh) object.castShadow = true; });
    scene.add(npc);
  });
}
scene.add(avatar);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const views = {
  full: [0, 1.0, 5.2, 0, 0.95, 0],
  row: [0, 1.3, 6.2, 0, 1.0, 0],
  upper: [0, 1.45, 2.4, 0, 1.3, 0],
  face: [0.0, 1.7, 0.85, 0, 1.69, 0],
  hand: [-0.55, 0.85, 1.1, -0.22, 0.85, 0],
  back: [0, 1.2, -4.0, 0, 1.0, 0],
};
const viewPose = views[view] || views.full;
camera.position.set(viewPose[0], viewPose[1], viewPose[2]);
camera.lookAt(viewPose[3], viewPose[4], viewPose[5]);
if (mode !== "actor" && pose === "walk") {
  const rig = avatar.userData.rig;
  rig.leftLeg.hip.rotation.x = 0.5;
  rig.rightLeg.hip.rotation.x = -0.5;
  rig.leftLeg.knee.rotation.x = 0.1;
  rig.rightLeg.knee.rotation.x = 0.6;
  rig.leftArm.rotation.x = -0.6;
  rig.rightArm.rotation.x = 0.6;
  rig.leftArm.userData.elbow.rotation.x = -0.55;
  rig.rightArm.userData.elbow.rotation.x = -0.25;
}
if (mode !== "actor" && pose === "extreme") {
  const rig = avatar.userData.rig;
  rig.leftLeg.hip.rotation.x = -0.7;
  rig.rightLeg.hip.rotation.x = 0.5;
  rig.leftLeg.knee.rotation.x = 0.1;
  rig.rightLeg.knee.rotation.x = 0.9;
  rig.leftLeg.ankle.rotation.x = 0.55;
  rig.rightLeg.ankle.rotation.x = -0.9;
  rig.leftArm.rotation.x = -1.5;
  rig.rightArm.rotation.x = 0.9;
  rig.leftArm.rotation.z = 0.5;
  rig.leftArm.userData.elbow.rotation.x = -1.2;
  rig.rightArm.userData.elbow.rotation.x = -0.4;
}

function visibleStats(root) {
  let draws = 0;
  let triangles = 0;
  root.traverse((object) => {
    if (!object.isMesh || !object.visible) return;
    let parent = object.parent;
    while (parent) {
      if (!parent.visible) return;
      parent = parent.parent;
    }
    draws += Array.isArray(object.material) ? object.material.length : 1;
    triangles += (object.geometry.index?.count ?? object.geometry.getAttribute("position")?.count ?? 0) / 3;
  });
  return { draws, triangles: Math.round(triangles) };
}
window.__avatar = avatar;
window.__actorHandle = actorHandle;
window.__characterStats = { ...visibleStats(avatar), buildMs, person: avatar.children[0]?.userData.personGeometryStats };

function renderFrame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - (renderFrame.last || now)) / 1000));
  renderFrame.last = now;
  renderFrame.time = (renderFrame.time || 0) + dt;
  if (actorHandle) actorHandle.update(dt, renderFrame.time);
  else {
    const rig = avatar.userData.rig;
    const t = renderFrame.time;
    rig.spine.position.y = 0.98 + Math.sin(t * 1.65) * 0.008;
    rig.spine.rotation.z = Math.sin(t * 0.72) * 0.009;
    rig.head.rotation.y = Math.sin(t * 0.38) * 0.025;
    rig.gazeL.position.x = Math.sin(t * 0.29) * 0.002;
    rig.gazeR.position.x = rig.gazeL.position.x;
    const leftBlink = Math.max(0, 1 - Math.abs(((t + 0.7) % 4.2) - 0.07) / 0.07);
    const rightBlink = Math.max(0, 1 - Math.abs(((t + 0.79) % 4.2) - 0.07) / 0.07);
    rig.eyeL.scale.y = 0.94 * (1 - leftBlink * 0.9);
    rig.eyeR.scale.y = 0.94 * (1 - rightBlink * 0.9);
  }
  avatar.userData.updateHumanVisual?.();
  renderer.render(scene, camera);
}
renderFrame(performance.now());
renderer.compile(scene, camera);
renderFrame(performance.now());
window.__r = renderer;
window.__diag = renderer.info.programs.filter((program) => program.diagnostics && !program.diagnostics.runnable).map((program) => (program.diagnostics.fragmentShader?.log || "") + (program.diagnostics.vertexShader?.log || "") + (program.diagnostics.programLog || ""));
document.title = `${mode}/${pose} ${JSON.stringify(window.__characterStats)} programs ${renderer.info.programs.length} bad ${window.__diag.length}`;
if (q.get("shot")) fetch("http://localhost:5190/" + q.get("shot"), { method: "POST", body: renderer.domElement.toDataURL("image/png") }).then(() => { document.title += " shot-sent"; });
renderer.setAnimationLoop(renderFrame);
const toolbar = document.createElement("nav");
toolbar.style.cssText = "position:fixed;left:12px;top:12px;display:flex;gap:8px;padding:8px;background:#172431db;color:white;border-radius:8px;font:14px sans-serif";
for (const [label, key, values] of [["姿势", "pose", ["stand", "listen", "talk", "read", "phone", "sit", "walk"]], ["人物", "human", ["male", "female"]], ["表情", "expression", ["neutral", "listen", "think", "softSmile", "talk"]], ["视角", "v", ["full", "upper", "face", "back"]]]) {
  const field = document.createElement("label"); field.textContent = label + " ";
  const select = document.createElement("select"); select.setAttribute("aria-label", label);
  for (const value of values) { const option = document.createElement("option"); option.value = option.textContent = value; select.append(option); }
  select.value = q.get(key) || values[0];
  select.addEventListener("change", () => { const next = new URL(location.href); next.searchParams.set(key, select.value); location.href = next.href; });
  field.append(select); toolbar.append(field);
}
document.body.append(toolbar);
</script>
