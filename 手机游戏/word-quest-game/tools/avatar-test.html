<!doctype html>
<meta charset="utf-8" />
<title>角色预览（开发工具）</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="module">
import * as THREE from "three";
import { createExplorerAvatar } from "/src/features/world/explorerAvatar.ts";
const q = new URLSearchParams(location.search);
const view = q.get("v") || "full";
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight);
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(0xa9c2d6);
s.add(new THREE.HemisphereLight(0xcfe4ff, 0x4a4a3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(2.5, 4, 3);
sun.castShadow = true;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.015;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
s.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x6d8a55, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
s.add(ground);
const t0 = performance.now();
const a = createExplorerAvatar();
window.__buildMs = Math.round(performance.now() - t0);
a.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const yaw = +(q.get("yaw") ?? 0.5);
a.rotation.y = yaw;
s.add(a);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const views = {
  full: [0, 1.0, 5.2, 0, 0.95, 0],
  upper: [0, 1.45, 2.4, 0, 1.3, 0],
  face: [0.0, 1.7, 0.85, 0, 1.69, 0],
  hand: [-0.55, 0.85, 1.1, -0.22, 0.85, 0],
  back: [0, 1.2, -4.0, 0, 1.0, 0],
};
const v = views[view] || views.full;
cam.position.set(v[0], v[1], v[2]);
cam.lookAt(v[3], v[4], v[5]);
if (q.get("pose") === "walk") { const rig = a.userData.rig; rig.leftLeg.hip.rotation.x = 0.5; rig.rightLeg.hip.rotation.x = -0.5; rig.leftLeg.knee.rotation.x = 0.1; rig.rightLeg.knee.rotation.x = 0.6; rig.leftArm.rotation.x = -0.6; rig.rightArm.rotation.x = 0.6; rig.leftLeg.ankle.rotation.x = -(0.5 + 0.1) * 0.9; rig.rightLeg.ankle.rotation.x = -(-0.5 + 0.6) * 0.9; rig.leftArm.userData.elbow.rotation.x = -0.25 - 0.33; rig.rightArm.userData.elbow.rotation.x = -0.25; }
if (q.get('pose') === 'extreme') { const rig = a.userData.rig; rig.leftLeg.hip.rotation.x = -0.7; rig.rightLeg.hip.rotation.x = 0.5; rig.leftLeg.knee.rotation.x = 0.1; rig.rightLeg.knee.rotation.x = 0.9; rig.leftLeg.ankle.rotation.x = 0.55; rig.rightLeg.ankle.rotation.x = -0.9; rig.leftArm.rotation.x = -1.5; rig.rightArm.rotation.x = 0.9; rig.leftArm.rotation.z = 0.5; rig.leftArm.userData.elbow.rotation.x = -1.2; rig.rightArm.userData.elbow.rotation.x = -0.4; }
r.render(s, cam);
r.compile(s, cam);
r.render(s, cam);
window.__r = r;
window.__diag = r.info.programs.filter((p) => p.diagnostics && !p.diagnostics.runnable).map((p) => (p.diagnostics.fragmentShader && p.diagnostics.fragmentShader.log || '') + (p.diagnostics.vertexShader && p.diagnostics.vertexShader.log || '') + (p.diagnostics.programLog || ''));
document.title = 'build ' + window.__buildMs + 'ms programs ' + r.info.programs.length + ' bad ' + window.__diag.length;
if (q.get('shot')) { r.render(s, cam); fetch('http://localhost:5190/' + q.get('shot'), { method: 'POST', body: r.domElement.toDataURL('image/png') }).then(() => { document.title += ' shot-sent'; }); }
r.setAnimationLoop(() => r.render(s, cam));
</script>
