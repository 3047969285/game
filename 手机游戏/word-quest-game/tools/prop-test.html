<!doctype html>
<meta charset="utf-8" />
<title>自然物预览（开发工具）</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="module">
import * as THREE from "three";
import { createTree, createPine, createBush, createRock } from "/src/features/world/props.ts";
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(0x8fb4d8);
s.add(new THREE.HemisphereLight(0xcfe4ff, 0x405040, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.position.set(20, 30, 14);
sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -20;
sun.shadow.camera.right = sun.shadow.camera.top = 20;
s.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshStandardMaterial({ color: 0x5f8a4e, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
s.add(ground);
const put = (o, x, z) => { o.position.set(x, 0, z); s.add(o); };
put(createTree(1), -6, 0);
put(createTree(1.6), 0, 0);
put(createTree(1.1), 6, 0);
put(createPine(1.2), 11, 0);
put(createBush(1.2), -10, 2);
put(createRock(1.2), -12, -1);
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
cam.position.set(1, 5, 16);
cam.lookAt(1, 2.2, 0);
r.setAnimationLoop(() => r.render(s, cam));
</script>
