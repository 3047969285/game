<!doctype html><html lang="zh"><meta charset="utf-8"><title>世界画质 · 固定机位核验</title><style>body{margin:0;font:13px system-ui;background:#111a25;color:#dceafa}header{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px;border:1px solid #8cabc2;background:#223447;color:white;border-radius:5px}iframe{width:1280px;height:720px;border:0}pre{margin:5px 10px;font-size:11px}</style><header><button id="save">保存机位</button><button id="restore">恢复机位</button><button id="measure">记录 120 帧</button><button id="pause-render">暂停验证渲染</button><label><input type="checkbox" checked id="SSRPass">SSR</label><label><input type="checkbox" checked id="GTAOPass">GTAO</label><label><input type="checkbox" checked id="ShaderPass">空气透视</label><label><input type="checkbox" checked id="TemporalAA">TAA</label><select id="weather" aria-label="核验天气"><option value="clear">晴</option><option value="overcast">多云</option><option value="heavyRain">大雨</option><option value="drizzleMist">雾</option><option value="dusk">黄昏</option><option value="night">夜晚</option></select><select id="resolution" aria-label="核验分辨率"><option value="quality">2K 画质优先</option><option value="balanced">自动分辨率</option></select><button id="export">生成 2560×1440 验收图</button><button id="inspect">渲染状态</button></header><pre id="result">载入正式游戏，同一窗口使用相同画质和机位对比。</pre><iframe id="game" src="/?perf=1"></iframe><figure id="export-preview" hidden><figcaption>原生 2560×1440 验收图 · <a id="export-file" download="world-2k.png">保存 PNG</a></figcaption><img id="export-image" alt="原生 2560×1440 世界验收图" style="max-width:1280px;width:100%;height:auto"></figure><script type="module">
const $=id=>document.getElementById(id),get=()=>$('game').contentWindow.__world;let saved;
$('pause-render').onclick=()=>{const w=get();if(!w)return;if(w.paused){w.resume();$('pause-render').textContent='暂停验证渲染';}else{w.pause();$('pause-render').textContent='继续验证渲染';}};
$('save').onclick=()=>{const w=get();if(w){saved={p:w.camera.position.clone(),q:w.camera.quaternion.clone()};$('result').textContent='机位已保存';}};
$('restore').onclick=()=>{const w=get();if(saved&&w){w.camera.position.copy(saved.p);w.camera.quaternion.copy(saved.q);w.camera.updateMatrixWorld();}};
for(const [id,name]of [['SSRPass','ssr'],['GTAOPass','ao'],['ShaderPass','aerial'],['TemporalAA','taa']])$(id).onchange=()=>get()?.setRenderFeature(name,$(id).checked);
$('resolution').onchange=()=>get()?.setResolutionMode($('resolution').value);
$('export').onclick=()=>{const url=get().capture2K();$('export-image').src=url;$('export-file').href=url;$('export-preview').hidden=false;$('result').textContent='已生成原生 2560×1440 验收图，下方可预览和保存 PNG';};
$('weather').onchange=()=>get()?.setWeather($('weather').value,4);
$('inspect').onclick=()=>{const w=get();$('result').textContent=JSON.stringify({quality:w?.quality,pixels:w?.renderer.domElement.width+"×"+w?.renderer.domElement.height,profile:w?.performanceSnapshot(),passes:w?.composer?.passes.map(p=>p.constructor.name),fog:w?.scene.fog?.density,exposure:w?.renderer.toneMappingExposure,environment:w?.scene.environmentIntensity,csm:w?.cascades?.csm.lights.map(l=>l.intensity)},null,0);};
$('measure').onclick=()=>{get()?.perf?.reset();let times=[],last=0;function frame(t){if(last)times.push(t-last);last=t;if(times.length<120)requestAnimationFrame(frame);else{times.sort((a,b)=>a-b);const w=get();$('result').textContent=JSON.stringify({meanMs:times.reduce((a,b)=>a+b,0)/times.length,p95Ms:times[113],ratio:w?.renderer.getPixelRatio(),actual:w?.performanceSnapshot(),camera:w?.camera.position.toArray()});}}requestAnimationFrame(frame);};
</script></html>
