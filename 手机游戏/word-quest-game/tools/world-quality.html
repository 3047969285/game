<!doctype html><html lang="zh"><meta charset="utf-8"><title>世界画质 · 固定机位核验</title><style>body{margin:0;font:13px system-ui;background:#111a25;color:#dceafa}header{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px;border:1px solid #8cabc2;background:#223447;color:white;border-radius:5px}iframe{width:100%;height:calc(100vh - 125px);border:0}pre{margin:5px 10px;font-size:11px}</style><header><button id="save">保存机位</button><button id="restore">恢复机位</button><button id="measure">记录 120 帧</button><label><input type="checkbox" checked id="SSRPass">SSR</label><label><input type="checkbox" checked id="GTAOPass">GTAO</label><label><input type="checkbox" checked id="ShaderPass">空气透视</label><label><input type="checkbox" checked id="TemporalAA">TAA</label><button id="inspect">渲染状态</button></header><pre id="result">载入正式游戏，同一窗口使用相同画质和机位对比。</pre><iframe id="game" src="/?perf=1"></iframe><script type="module">
const $=id=>document.getElementById(id),get=()=>$('game').contentWindow.__world;let saved;
$('save').onclick=()=>{const w=get();if(w){saved={p:w.camera.position.clone(),q:w.camera.quaternion.clone()};$('result').textContent='机位已保存';}};
$('restore').onclick=()=>{const w=get();if(saved&&w){w.camera.position.copy(saved.p);w.camera.quaternion.copy(saved.q);w.camera.updateMatrixWorld();}};
for(const name of ['SSRPass','GTAOPass','ShaderPass','TemporalAA'])$(name).onchange=()=>{const w=get();for(const p of w?.composer?.passes??[])if(p.constructor.name.replace(/^_+/,'')===name && (name!=='ShaderPass'||p.uniforms?.tDepth))p.enabled=$(name).checked;};
$('inspect').onclick=()=>{const w=get();$('result').textContent=JSON.stringify({quality:w?.quality,passes:w?.composer?.passes.map(p=>p.constructor.name),fog:w?.scene.fog?.density,exposure:w?.renderer.toneMappingExposure,environment:w?.scene.environmentIntensity,csm:w?.cascades?.csm.lights.map(l=>l.intensity)},null,0);};
$('measure').onclick=()=>{let times=[],last=0;function frame(t){if(last)times.push(t-last);last=t;if(times.length<120)requestAnimationFrame(frame);else{times.sort((a,b)=>a-b);const w=get();$('result').textContent=JSON.stringify({meanMs:times.reduce((a,b)=>a+b,0)/times.length,p95Ms:times[113],ratio:w?.renderer.getPixelRatio(),camera:w?.camera.position.toArray()});}}requestAnimationFrame(frame);};
</script></html>
