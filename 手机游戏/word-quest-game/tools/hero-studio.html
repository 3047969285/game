<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英雄模型 · 参考对照影棚</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#223544;background:#f5f7fa;font:13px/1.5 system-ui}header{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dbe2ea}button,select{font:inherit;color:inherit;border:1px solid #bdcad6;border-radius:6px;background:white;padding:7px 10px}button{cursor:pointer}#status{flex-basis:100%;font-size:12px}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 120px);min-height:360px}section{display:flex;flex-direction:column;min-width:0}h2{font-size:13px;text-align:center;font-weight:500;margin:8px}#refwrap{flex:1;position:relative;background:white;overflow:hidden;display:flex;justify-content:center;min-height:0}#refcrop{height:100%;aspect-ratio:1/2;max-width:100%;position:relative;overflow:hidden}#ref{position:absolute;height:100%;width:auto;max-width:none;left:0;top:0}#refcrop.portrait{aspect-ratio:1/1}#refcrop.portrait img{width:100%;height:100%;object-fit:contain;transform:none!important}#modelwrap{flex:1;min-height:0;background:white;position:relative}#pending{position:absolute;inset:0;display:grid;place-items:center;color:#617586;font-size:20px;background:#f8fafc}#pending[hidden]{display:none}canvas{display:block;width:100%;height:100%}#thumbnails{display:flex;justify-content:center;gap:8px;padding:8px;overflow:auto}#thumbnails button{padding:2px;line-height:0}#thumbnails img{height:54px;width:54px;object-fit:cover}#notes{padding:8px 14px;font-size:12px;color:#576b7e;max-height:90px;overflow:auto}@media(max-width:700px){main{height:calc(100dvh - 190px)}header{padding:8px}#thumbnails img{height:40px;width:40px}button,select{padding:5px}}
</style>
<header><select id="character" aria-label="角色"><option value="me2026">男主 · me2026</option><option value="lin">女主 · Lin</option></select><select id="angle" aria-label="查看角度"><option value="front">全身正面</option><option value="side">全身侧面</option><option value="back">全身背面</option><option value="portrait">正面胸像</option><option value="threeQuarter">四分之三胸像</option><option value="sidePortrait">侧面胸像</option></select><button id="reload">重新检查交付</button><button id="blink">眨眼</button><button id="smile">微笑</button><button id="jaw">张嘴</button><span id="status" role="status">正在载入模型…</span></header>
<main><section><h2>原始参考图 · 相同朝向</h2><div id="refwrap"><div id="refcrop"><img id="ref" alt="角色参考图"></div></div><div id="thumbnails"></div></section><section><h2>实时三维模型 · 中性影棚光</h2><div id="modelwrap"><div id="pending" role="status">新模型制作中（Claude）</div></div><div id="notes"></div></section></main>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {loadHumanModels} from '/src/features/world/humanVisual.ts';
import {getCharacterModel,getCharacterModelReport,HERO_MODELS} from '/src/features/world/characterModels.ts';
import {spawnActor} from '/src/features/memory/actors.ts';
import {characterLook} from '/src/features/memory/characters.ts';
const $=id=>document.getElementById(id),wrap=$('modelwrap');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1.0;wrap.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('white');
const pm=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment(),env=pm.fromScene(room,.04);scene.environment=env.texture;scene.environmentIntensity=.7;pm.dispose();room.dispose();
scene.add(new THREE.HemisphereLight(0xffffff,0xb7c0ca,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(3,4,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.1,far:15});key.shadow.normalBias=.008;scene.add(key);
const fill=new THREE.DirectionalLight(0xf5f8ff,1);fill.position.set(-3,2,4);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:.14}));ground.rotation.x=-Math.PI/2;ground.position.y=-.005;ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,30);let raf=0;function requestRender(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderer.render(scene,camera);});}let actor,height=1.8,modelWidth=.7,center=new THREE.Vector3(0,.9,0),loadVersion=0,alive=true;
const referenceRoot='./hero-reference/';
function reference(){const female=$('character').value==='lin',angle=$('angle').value,crop=$('refcrop'),img=$('ref');crop.classList.toggle('portrait',angle==='portrait'||angle==='threeQuarter'||angle==='sidePortrait');if(angle==='portrait'||angle==='threeQuarter'||angle==='sidePortrait'){img.src=referenceRoot+`lian${(female?5:1)+(angle==='threeQuarter'?2:angle==='sidePortrait'?1:0)}.png`;img.style.transform='none';}else{img.src=referenceRoot+(female?'female_sheet.png':'male_sheet.png');img.style.transform=`translateX(-${({front:0,side:1,back:2}[angle])*100/3}%)`;}}
function frame(){reference();if(!actor)return;const angle=$('angle').value,portrait=angle==='portrait'||angle==='threeQuarter'||angle==='sidePortrait';actor.root.rotation.y=({front:0,side:-Math.PI/2,back:Math.PI,portrait:0,threeQuarter:-Math.PI/4,sidePortrait:-Math.PI/2}[angle]);actor.root.updateMatrixWorld(true);const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const aspect=w/h,span=portrait?height*.36:Math.max(height*1.12,modelWidth*1.12/aspect);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;const y=portrait?height*.85:center.y;camera.position.set(center.x,y,6);camera.lookAt(center.x,y,0);camera.updateProjectionMatrix();reference();requestRender();}
function faces(){return actor?.root.children[0]?.userData.humanVisual?.faces??[];}
function setMorph(names){for(const face of faces())for(const name of names){const index=face.morphTargetDictionary?.[name];if(index!==undefined&&face.morphTargetInfluences)face.morphTargetInfluences[index]=face.morphTargetInfluences[index]>.5?0:1;}requestRender();}
async function load(){const version=++loadVersion,id=$('character').value;$('status').textContent='正在检查英雄模型…';await loadHumanModels([HERO_MODELS[id]]);if(version!==loadVersion||!alive)return;actor?.dispose();actor=undefined;const ready=!!getCharacterModel(HERO_MODELS[id]);$('pending').hidden=ready;renderer.domElement.hidden=!ready;for(const control of ['blink','smile','jaw'])$(control).disabled=!ready;if(!ready){$('status').textContent='新模型制作中（Claude）';$('notes').textContent='交付通过检查后才显示三维模型；参考图不代表模型已完成。';reference();return;}actor=spawnActor({id,name:id,look:{...characterLook(id),seated:false},position:{x:0,y:0,z:0},rotationY:0,pose:'stand'},[],'high');scene.add(actor.root);for(let i=0;i<60;i++)actor.update(1/60,i/60);actor.root.updateMatrixWorld(true);const info=actor.root.children[0].userData.humanVisual;const box=new THREE.Box3().setFromObject(info?.visual??actor.root);height=box.max.y-box.min.y;modelWidth=box.max.x-box.min.x;box.getCenter(center);const report=getCharacterModelReport(HERO_MODELS[id]);$('status').textContent=info?.sourceModel?`已加载 ${info.sourceModel} · 原始身高 ${report?.height.toFixed(3)} m`:'新模型制作中（Claude）';$('notes').textContent=report?`${Math.round(report.triangles)} 三角形 · ${report.materials} 材质 · ${report.warnings.join('；')||'骨架与表情合同检查通过'}`:'参考图片不代表模型完成；文件交付后点“重新检查交付”即可重试。';$('thumbnails').replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('button'),im=document.createElement('img');im.src=referenceRoot+`lian${(id==='lin'?5:1)+i}.png`;im.alt=`脸部参考 ${i+1}`;b.append(im);b.onclick=()=>{$('angle').value=i===0?'portrait':i===2?'threeQuarter':'sidePortrait';frame();if(i===1||i===3){$('refcrop').classList.add('portrait');$('ref').src=im.src;$('ref').style.transform='none';}};$('thumbnails').append(b);}frame();}
$('character').onchange=load;$('angle').onchange=frame;$('reload').onclick=load;$('blink').onclick=()=>setMorph(['eyeBlinkLeft','eyeBlinkRight']);$('smile').onclick=()=>setMorph(['mouthSmileLeft','mouthSmileRight']);$('jaw').onclick=()=>setMorph(['jawOpen']);const observer=new ResizeObserver(frame);observer.observe(wrap);await load();
requestRender();window.addEventListener('pagehide',()=>{alive=false;loadVersion++;cancelAnimationFrame(raf);observer.disconnect();actor?.dispose();env.dispose();ground.geometry.dispose();ground.material.dispose();renderer.dispose();},{once:true});
</script></html>
