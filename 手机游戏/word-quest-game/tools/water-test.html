<!doctype html>
<meta charset="utf-8" />
<title>水面材质预览（开发工具）</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="module">
import * as THREE from "three";
import { createSimpleWaterMaterial, waterUniforms } from "/src/features/world/waterSurface.ts";
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(0x8fb4d8);
s.add(new THREE.HemisphereLight(0xcfe4ff, 0x405040, 1.2));
const sun = new THREE.DirectionalLight(0xfff0d0, 2);
sun.position.set(30, 40, 20);
s.add(sun);
const p = new THREE.Mesh(new THREE.PlaneGeometry(60, 40, 16, 10), createSimpleWaterMaterial({ depth: 1.2, quality: "high" }));
p.rotation.x = -Math.PI / 2;
s.add(p);
const bank = new THREE.Mesh(new THREE.BoxGeometry(70, 1, 10), new THREE.MeshStandardMaterial({ color: 0x5a7a4a }));
bank.position.set(0, 0, -24);
s.add(bank);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
cam.position.set(0, 7, 28);
cam.lookAt(0, 0, 0);
r.setAnimationLoop((t) => {
  waterUniforms.time.value = t / 1000;
  waterUniforms.sunDir.value.copy(sun.position).normalize();
  waterUniforms.sunColor.value.copy(sun.color).multiplyScalar(Math.min(sun.intensity, 3));
  r.render(s, cam);
});
</script>
