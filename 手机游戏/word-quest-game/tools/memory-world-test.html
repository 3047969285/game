<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆世界 · 细节与重现预览</title>
<style>
body{margin:0;background:#111823;color:#e7dfd0;font:13px system-ui}canvas{display:block}#bar{position:fixed;top:16px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}button,select{font:inherit;color:inherit;background:#17202aeb;border:1px solid #69757a;border-radius:8px;padding:8px 12px}button{cursor:pointer}#hint{position:fixed;bottom:16px;left:16px;max-width:85vw;padding:10px 14px;background:#111b26d9;border-radius:8px;line-height:1.7;pointer-events:none}#status{color:#d6c396}
</style>
<div id="bar"><select id="stage" aria-label="舞台"><option value="clubRoom">周四的社团教室</option><option value="emptyRoom">通用回忆教室</option></select><select id="quality" aria-label="画质"><option value="high">高画质</option><option value="low">低画质</option></select><button id="replay">重播记忆重现</button><button id="finish">完整世界</button><button id="close">桌面细节</button><button id="wide">空间全景</button><button id="pause">暂停动画</button><span id="status"></span></div>
<div id="hint">拖动旋转 · 滚轮缩放<br>使用正式游戏的舞台、显形材质和窗边浮尘；此页仅预览空间，不播放音频或剧情。</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createSceneKit } from '/src/features/world/sceneProps.ts';
import { buildSkyEnvironment } from '/src/features/world/postPipeline.ts';
import { buildStage,getStage } from '/src/features/memory/stages/index.ts';
import { Materializer } from '/src/features/memory/Materializer.ts';
import { MemoryAir } from '/src/features/memory/MemoryAir.ts';
const $ = id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1.22;
document.body.append(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,120);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxDistance=25;controls.minDistance=.35;
const sun=new THREE.DirectionalLight();sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
const hemi=new THREE.HemisphereLight();scene.add(sun,sun.target,hemi);
let room,mz,air,env,time=0,paused=false,last=performance.now();
function framing(close=false){camera.position.set(...(close?[1.6,1.8,1.8]:[0,4.4,10.5]));controls.target.set(...(close?[0,.76,-.25]:[0,1,-1]));controls.update();}
function clear(){
  mz?.dispose();air?.dispose();
  if(room){const geos=new Set(),mats=new Set();room.traverse(o=>{if(o.isMesh){geos.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])mats.add(m);}});for(const g of geos)g.dispose();for(const m of mats)m.dispose();for(const fn of room.userData.disposers??[])fn();room.removeFromParent();}
  env?.dispose();
}
function build(playing=false){
  clear();time=0;paused=false;$('pause').textContent='暂停动画';
  const def=getStage($('stage').value),e=def.environment;
  scene.background=new THREE.Color(e.fogColor);scene.fog=new THREE.FogExp2(e.fogColor,e.fogDensity);
  const dir=new THREE.Vector3(e.sunDir.x,e.sunDir.y,e.sunDir.z).normalize();sun.color.set(e.sunColor);sun.position.copy(dir).multiplyScalar(26);
  Object.assign(sun.shadow.camera,{left:-e.shadowRadius,right:e.shadowRadius,top:e.shadowRadius,bottom:-e.shadowRadius,near:1,far:60});sun.shadow.camera.updateProjectionMatrix();
  hemi.color.set(e.hemiSky);hemi.groundColor.set(e.hemiGround);
  env=buildSkyEnvironment(renderer,{...e,sunDir:dir});scene.environment=env?.texture??null;
  const kit=createSceneKit($('quality').value);room=buildStage(def.name,kit);scene.add(room);
  mz=new Materializer({capacity:$('quality').value==='low'?1800:4800,perPiece:$('quality').value==='low'?90:160});scene.add(mz.group);
  room.children.forEach((child,i)=>{mz.register(child,def.targets[child.name]);void mz.reveal(child.name,3,{delay:playing?i*.14:0});});
  if(!playing){mz.completeAll();mz.update(8);time=8;}
  air=new MemoryAir(def.bounds,$('quality').value);scene.add(air.object);
}
$('replay').onclick=()=>build(true);$('finish').onclick=()=>mz.completeAll();$('close').onclick=()=>framing(true);$('wide').onclick=()=>framing(false);
$('stage').onchange=()=>{build();framing();};$('quality').onchange=()=>build();
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续动画':'暂停动画';};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
build();framing();
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){time+=dt;mz.update(dt);}
const def=getStage($('stage').value),e=def.environment;const progress=mz.progress();const level=.3+.7*progress;
sun.intensity=e.sunIntensity*level*level;hemi.intensity=e.hemiIntensity*level;scene.environmentIntensity=e.envIntensity*level;
air.update(time,mz.progress(p=>p.id==='window'||p.id==='floor'),renderer.domElement.height,camera.fov);mz.setView(renderer.domElement.height,camera.fov);
controls.update();renderer.render(scene,camera);$('status').textContent=`重现 ${Math.round(progress*100)}% · ${renderer.info.render.calls} 次绘制`;}
requestAnimationFrame(tick);
window.addEventListener('pagehide',()=>{clear();controls.dispose();renderer.dispose();},{once:true});
</script></html>
